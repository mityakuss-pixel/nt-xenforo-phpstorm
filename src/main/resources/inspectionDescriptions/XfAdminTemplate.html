<html>
<body>
Reports <code>admin:</code> templates included from public and email templates, for example
<code>&lt;xf:include template="admin:…" /&gt;</code> or <code>&lt;xf:macro id="admin:…::…" /&gt;</code>.
XenForo compiles admin templates only for the admin control panel, so they are not found when a public page or an email is rendered.
</body>
