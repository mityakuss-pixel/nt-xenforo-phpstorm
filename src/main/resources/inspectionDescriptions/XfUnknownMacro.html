<body>
Reports macro calls such as <code>&lt;xf:macro id="template::name" /&gt;</code> and <code>call_macro('template', 'name')</code>
when the template is known but has no macro with that name.
The check is skipped for templates that are not found and for templates changed by template modifications that may add the macro.
</body>
