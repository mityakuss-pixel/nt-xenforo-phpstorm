<body>
Replaces a XenForo short class name such as <code>'XF:User'</code> with the class constant it resolves to,
for example <code>\XF\Entity\User::class</code> in <code>finder()</code>, <code>create()</code> and relations,
or <code>\XF\Repository\UserRepository::class</code> in <code>repository()</code>.
View names, behaviors and <code>$structure-&gt;shortName</code> keep short names.
